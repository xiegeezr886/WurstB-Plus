# ============================================================================
# WurstB+ Plus — dependency version register (single source of truth)
#
# WHY THIS FILE EXISTS
#   The repository holds 67 INDEPENDENT Gradle builds. Each one declares its own
#   dependency coordinates, so before this file a single dependency bump meant
#   editing up to 67 build.gradle files by hand, and nothing detected drift.
#   This file is the register the whole repo is checked against.
#
# HOW TO BUMP A DEPENDENCY
#   1. Edit the version here.
#   2. Run:  pwsh -File scripts/dependency-versions.ps1 -Bump "<g:a>" "<old>" "<new>" -Apply
#   3. Run:  pwsh -File scripts/dependency-versions.ps1 -Check
#
# VERIFYING (use in CI)
#   pwsh -File scripts/dependency-versions.ps1 -Check
#   Exits 1 if any build.gradle uses a version that is not listed below, or if a
#   listed version is no longer used by any project.
#
# FORMAT
#   <group>:<artifact> = <version>[,<version>...]
#   Several versions on one line mean "each of these is intentionally allowed"
#   — see the CONFLICT notes. Prefer a single version wherever possible.
# ============================================================================

# --- Minecraft / modding platform ------------------------------------------
# CONFLICT (needs a decision — NOT resolvable without building):
#   The root project (Forge 1.20.1) uses the Mixin annotation processor 0.8.5;
#   the other 12 projects that use it declare 0.8.7. One of the two is stale.
#   The 26.x projects have this line COMMENTED OUT, so they use neither.
#   Pick one, then run the -Bump command documented at the top of this file.
org.spongepowered:mixin = 0.8.5,0.8.7
org.spongepowered:mixingradle = 0.7-SNAPSHOT
net.minecraftforge:eventbus-validator = 7.0.5
io.github.llamalad7:mixinextras-common = 0.5.4
io.github.llamalad7:mixinextras-forge = 0.5.4
org.ow2.asm:asm-commons = 9.7

# --- Networking -------------------------------------------------------------
# CONFLICT (documented, deliberate — do NOT merge):
#   netty must match the netty that each Minecraft version itself bundles,
#   otherwise the mod sees a different netty API than the game at runtime.
#     4.1.82.Final  -> the 1.20.x / early-1.21 band
#     4.1.118.Final -> the 1.21.5-1.21.11 band
#     4.2.7.Final   -> the 26.x band
#   If you change one band, change only that band's value.
io.netty:netty-codec-socks = 4.1.82.Final,4.1.118.Final,4.2.7.Final
io.netty:netty-handler-proxy = 4.1.82.Final,4.1.118.Final,4.2.7.Final

