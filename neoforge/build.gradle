buildscript {
    repositories {
        maven {
            name = "Sponge"
            url = "https://repo.spongepowered.org/repository/maven-public/"
        }
    }
    dependencies {
        classpath "org.spongepowered:mixingradle:0.7-SNAPSHOT"
    }
}

plugins {
    id "eclipse"
    id "idea"
    id "maven-publish"
    id "net.minecraftforge.gradle" version "[6.0,6.2)"
}

apply plugin: "org.spongepowered.mixin"

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "WurstB+ Plus"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: "official", version: project.minecraft_version
    accessTransformer = file(
        "src/main/resources/META-INF/accesstransformer.cfg")
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
            property "forge.logging.console.level", "info"

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}
    }
}

repositories {
    maven {
        name = "Sponge"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
    mavenCentral()
    flatDir {
        dirs "${rootProject.projectDir}/.."
    }
}

jarJar.enable()

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    implementation fg.deobf(
        "io.github.llamalad7:mixinextras-forge:0.5.4")
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.4"
    jarJar(group: "io.github.llamalad7", name: "mixinextras-forge",
        version: "[0.5.4,)")
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
    implementation "org.java-websocket:Java-WebSocket:1.5.3"
    implementation "io.netty:netty-codec-socks:4.1.82.Final"
    implementation "io.netty:netty-handler-proxy:4.1.82.Final"
    implementation fg.deobf("baritone:baritone-api-forge:1.20.1")
    jarJar(group: "baritone", name: "baritone-api-forge",
        version: "[1.20.1,1.20.2)")
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

mixin {
	add sourceSets.main, "${project.mod_id}-refmap.json"
	config "wurst.mixins.json"
}

processResources {
    def displayVersion = project.version.toString().startsWith("v")
        ? project.version.toString().substring(1)
        : project.version.toString()
    inputs.property("version", displayVersion)

    filesMatching("META-INF/mods.toml") {
        expand(version: displayVersion)
    }
    filesMatching("wurst.mixins.json") {
        expand(version: displayVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

java {
    withSourcesJar()
}

jar {
	archiveClassifier = "dev"
	manifest {
        attributes(
            "MixinConfigs": "wurst.mixins.json",
            "Specification-Title": project.mod_id,
            "Specification-Vendor": project.mod_authors,
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": project.mod_authors)
    }

    from("LICENSE.txt") {
        rename { "LICENSE-${project.base.archivesName.get()}.txt" }
    }

    exclude "intentionally_untranslated.json"
    finalizedBy "reobfJar"
}

tasks.named("jarJar").configure {
    archiveFileName = "${project.base.archivesName.get()}-${project.version}.jar"
    finalizedBy "reobfJarJar"
}
