plugins {
	id "java-library"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "net.neoforged.gradle.userdev" version "7.0.184"
}

version = project.mod_version
group = project.mod_group_id

base {
	archivesName = "WurstB+ Plus"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
	main {
		java {
			exclude "net/wurstclient/clickgui2/component.disabled/**"
		}
		resources {
			srcDir "src/main/templates"
		}
	}
}

// --- Baritone is not published to any Maven repository ---------------------
// The built Baritone jar is committed at the repository root. Resolve it by
// walking up to the repository root (identified by gradle/wurstb-versions.properties)
// instead of relying on a jar sitting next to this build file, so that a fresh
// clone can configure and build this project.
def wurstbRepoRoot = rootDir
while (wurstbRepoRoot != null && !new File(wurstbRepoRoot, "gradle/wurstb-versions.properties").isFile()) {
	wurstbRepoRoot = wurstbRepoRoot.parentFile
}
if (wurstbRepoRoot == null) {
	throw new GradleException("Cannot locate the repository root above " + rootDir)
}
def baritoneJar = new File(projectDir, "libs/baritone-api-neoforge-1.10.6-1.20.2.jar")
if (!baritoneJar.isFile()) {
	throw new GradleException("Missing bundled Baritone jar: " + baritoneJar)
}
configurations {
	hudNatives
}

repositories {
	maven {
		name = "Sponge"
		url = "https://repo.spongepowered.org/repository/maven-public/"
	}
	mavenCentral()
	flatDir {
		dirs "."
	}
}

dependencies {
    implementation("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-windows") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-windows-arm64") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-linux") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-linux-arm64") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-macos") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-macos-arm64") { transitive = false }
    hudNatives("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}") { transitive = false }
    hudNatives("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-windows") { transitive = false }
    hudNatives("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-windows-arm64") { transitive = false }
    hudNatives("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-linux") { transitive = false }
    hudNatives("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-linux-arm64") { transitive = false }
    hudNatives("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-macos") { transitive = false }
    hudNatives("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-macos-arm64") { transitive = false }

	implementation "net.neoforged:neoforge:${project.neo_version}"
	annotationProcessor "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
	compileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
	implementation "org.java-websocket:Java-WebSocket:1.5.3"
	implementation "io.netty:netty-codec-socks:4.1.82.Final"
	implementation "io.netty:netty-handler-proxy:4.1.82.Final"
	implementation files(baritoneJar)
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

minecraft {
	accessTransformers {
		file "src/main/resources/META-INF/accesstransformer.cfg"
	}
}

runs {
	configureEach {
		workingDirectory project.file("run")
		systemProperty "forge.logging.markers", "REGISTRIES"
		systemProperty "forge.logging.console.level", "debug"
		modSource project.sourceSets.main
	}
	client {
		client()
	}
}

processResources {
	def displayVersion = project.version.toString().startsWith("v")
		? project.version.toString().substring(1)
		: project.version.toString()
	def replaceProperties = [
		minecraft_version      : minecraft_version,
		minecraft_version_range: minecraft_version_range,
		neo_version            : neo_version,
		neo_version_range      : neo_version_range,
		loader_version_range   : loader_version_range,
		mod_id                 : mod_id,
		mod_name               : mod_name,
		mod_license            : mod_license,
		mod_authors            : mod_authors,
		mod_version            : displayVersion,
	]
	inputs.properties replaceProperties
	filesMatching(["META-INF/neoforge.mods.toml", "META-INF/mods.toml", "wurst.mixins.json"]) {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 17
}

java {
	withSourcesJar()
}

jar {
	archiveFileName = "${project.base.archivesName.get()}-${project.version}.jar"
	manifest {
		attributes(
			"MixinConfigs": "wurst.mixins.json,mixins.baritone.json",
			"Specification-Title": project.mod_id,
			"Specification-Vendor": project.mod_authors,
			"Specification-Version": "1",
			"Implementation-Title": project.name,
			"Implementation-Version": project.version,
			"Implementation-Vendor": project.mod_authors)
	}
	from("LICENSE.txt") {
		rename { "LICENSE-${project.base.archivesName.get()}.txt" }
	}
	// Baritone must be embedded in the artifact: this mod's own classes
	// (BaritoneUtils, Baritone*Hack) and its mixin config reference it, and the
	// jar is not supplied by the loader. Mirrors the working neoforge/versions/1.21.
	zip64 = true
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from({ zipTree(baritoneJar) }) {
		exclude 'META-INF/mods.toml'
	}
	exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA', 'module-info.class'
	exclude "intentionally_untranslated.json"
}

processResources {
    from({ configurations.hudNatives.collect { zipTree(it) } }) {
        include "org/lwjgl/nanovg/**", "windows/**", "linux/**", "macos/**"
        exclude "META-INF/**", "module-info.class", "**/*.signature"
    }
}

// v1.5.2 portable music runtime. Keep host Netty and LWJGL versions.
configurations { v152MusicRuntime }
dependencies {
    v152MusicRuntime("com.googlecode.soundlibs:jlayer:1.0.1.4") { transitive = false }
    v152MusicRuntime("com.google.zxing:core:3.5.3") { transitive = false }
    implementation "com.googlecode.soundlibs:jlayer:1.0.1.4"
    implementation "com.google.zxing:core:3.5.3"
    compileOnly "net.java.dev.jna:jna:5.13.0"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ project.configurations.v152MusicRuntime.collect { zipTree(it) } }) {
        exclude "META-INF/**", "module-info.class"
    }
}
sourceSets.main.java {
    exclude "net/wurstclient/clickgui2/component/*.java"
    exclude "net/wurstclient/clickgui2/component.disabled/*.java"
}
tasks.withType(Test).configureEach { useJUnitPlatform() }

// v1.5.2 native network runtime: these APIs are not supplied by Minecraft.
dependencies {
    v152MusicRuntime("org.java-websocket:Java-WebSocket:1.5.3") { transitive = false }
    v152MusicRuntime("io.netty:netty-codec-socks:4.1.82.Final") { transitive = false }
    v152MusicRuntime("io.netty:netty-handler-proxy:4.1.82.Final") { transitive = false }
}

// Native SeedCrackerX source, solver and Cloth Config runtime.
apply from: "../../../gradle/seedcracker-native1204.gradle"
