plugins {
	id "fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "BundledBaritone"
		url = uri("baritone-maven")
	}
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	mavenCentral()
	flatDir {
		dirs "libs"
	}
}

dependencies {
	// Minecraft + Mojang official mappings (matches Forge port source)
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// JSR305 (needed for BlockPos @Immutable)
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"

	// Discord support
	include implementation("org.java-websocket:Java-WebSocket:1.5.3")

	// Proxy support
	include implementation("io.netty:netty-codec-socks:4.1.118.Final")
	include implementation("io.netty:netty-handler-proxy:4.1.118.Final")

	// Baritone is bundled from the checked-in local Maven repository.
	include implementation("baritone:baritone-api-fabric:1.10.3")

	// MixinExtras
	compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"
	annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.4"
}

loom {
	accessWidenerPath = file("src/main/resources/wurstpenguin.accesswidener")
}

sourceSets {
	main {
		java {
			exclude "net/wurstclient/clickgui2/component/*.java"
			exclude "net/wurstclient/clickgui2/component.disabled/*.java"
		}
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}


// ---------------------------------------------------------------------------
// 共享源码：把「在所有工程里逐字节相同」的文件收拢到 common/，各工程引用它。
// 这批文件共 293 个、原先在仓库里有 19,631 个物理副本。
// 只收「出现在全部 67 个工程且零变体」的文件，故增删不改变任何工程可见的
// 源集合；有变体的文件一律留在工程自己的 src/main/java 里。
// ---------------------------------------------------------------------------
sourceSets.main.java.srcDir "../common/src/main/java"