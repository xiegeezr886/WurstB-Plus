plugins {
	id "fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "BundledBaritone"
		url = uri("baritone-maven")
	}
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	mavenCentral()
	flatDir {
		dirs "libs"
	}
}

configurations {
	hudNatives
}

dependencies {
	// Minecraft + Mojang official mappings (matches Forge port source)
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// JSR305 (needed for BlockPos @Immutable)
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"

	// Discord support
	include implementation("org.java-websocket:Java-WebSocket:1.5.3")

	// Proxy support
	include implementation("io.netty:netty-codec-socks:4.1.118.Final")
	include implementation("io.netty:netty-handler-proxy:4.1.118.Final")

	// Baritone is bundled from the checked-in local Maven repository.
	// modImplementation (not implementation) so Loom remaps its intermediary
	// mixin/accessor descriptors to Mojang mappings in the dev runtime.
	modImplementation "baritone:baritone-api-fabric:1.10.3"
	// Loom's remapped dev jar drops Baritone's nested nether-pathfinder, so
	// put the same artifact on the dev classpath explicitly. The shipped jar
	// still gets the copy nested inside Baritone via the include below.
	modImplementation "dev.babbaj:nether-pathfinder:1.4.1"
	include "baritone:baritone-api-fabric:1.10.3"

	// MixinExtras
	compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"
	annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.4"

	// NanoVG HUD renderer (LWJGL 3 module matching Minecraft 1.20.1).
	// Do not pull LWJGL core transitively: Minecraft supplies the matching
	// core/GLFW, and mixing e.g. core 3.3.3 with GLFW 3.3.2 breaks
	// GLFWVidMode.wrap. nanovg 3.3.3 itself is compatible with core 3.3.1-3.3.3.
	include implementation("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}") {
		transitive = false
	}

	// Native libraries are unpacked into the mod jar by processResources.
	hudNatives "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-windows"
	hudNatives "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-windows-arm64"
	hudNatives "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-linux"
	hudNatives "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-linux-arm64"
	hudNatives "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-macos"
	hudNatives "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-macos-arm64"
}

loom {
	accessWidenerPath = file("src/main/resources/wurstpenguin.accesswidener")
}

sourceSets {
	main {
		java {
			exclude "net/wurstclient/clickgui2/component/*.java"
			exclude "net/wurstclient/clickgui2/component.disabled/*.java"
		}
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}

	from({ configurations.hudNatives.collect { zipTree(it) } }) {
		include "windows/**", "linux/**", "macos/**"
		into "assets/wurstpenguin/nanovg/natives"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

if(project.hasProperty("spWorld")) {
	tasks.matching { it.name == "runClient" }.configureEach {
		args "--quickPlaySingleplayer", project.property("spWorld")
		args "--quickPlayPath", project.property("spLog")
	}
}
