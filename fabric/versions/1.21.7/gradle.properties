# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties
# check these at https://fabricmc.net/develop/
minecraft_version=1.21.7
loader_version=0.19.5
loom_version=1.17.19

# Fabric API
fabric_version=0.129.0+1.21.7

# Mod Properties
mod_version=1.5.0-Fabric-1.21.7
maven_group=net.wurstpenguin
archives_base_name=WurstB+ Plus

# WurstB+ Properties
mod_id=wurstpenguin

# 内嵌 Baritone 版本（baritone-maven 本地仓库坐标）。
# 规则：必须是官方声明支持本工程 minecraft_version 的那个发布版。
#   1.15.0 = 官方支持 1.21.6 / 1.21.7 / 1.21.8
# 想换版本前先读 fabric/versions/1.21.7/build.gradle 里的说明。
baritone_version=1.15.0-1.21.7

# 国内镜像（BMCLAPI）：Minecraft 依赖库 / 资源文件 / 版本清单走国内源，
# 国外网络环境下可删掉以下三行恢复官方源。
loom_libraries_base=https://bmclapi2.bangbang93.com/maven/
loom_resources_base=https://bmclapi2.bangbang93.com/assets/
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
