plugins {
	id "fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

configurations {
	hudNatives
}

repositories {
	maven {
		name = "BundledBaritone"
		url = uri("../../../baritone-maven")
	}
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	mavenCentral()
	flatDir {
		dirs "libs"
	}
}

dependencies {
    include implementation("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-windows") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-windows-arm64") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-linux") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-linux-arm64") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-macos") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-macos-arm64") { transitive = false }
    hudNatives("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-windows") { transitive = false }
    hudNatives("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-windows-arm64") { transitive = false }
    hudNatives("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-linux") { transitive = false }
    hudNatives("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-linux-arm64") { transitive = false }
    hudNatives("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-macos") { transitive = false }
    hudNatives("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-macos-arm64") { transitive = false }

	// Minecraft + Mojang official mappings (matches Forge port source)
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// JSR305 (needed for BlockPos @Immutable)
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"

	// Discord support
	include implementation("org.java-websocket:Java-WebSocket:1.5.3")

	// Proxy support
	include implementation("io.netty:netty-codec-socks:4.1.118.Final") { transitive = false }
	include implementation("io.netty:netty-handler-proxy:4.1.118.Final") { transitive = false }

	include modImplementation("baritone:baritone-api-fabric:${project.baritone_version}")
	// Fabric Loader only extracts Baritone's nested jars in production;
	// dev runs need the bundled nether-pathfinder on the classpath explicitly.
	runtimeOnly "dev.babbaj:nether-pathfinder:1.6"

	// MixinExtras
	compileOnly "io.github.llamalad7:mixinextras-common:0.5.5"
	annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.5"
	include(modImplementation("io.github.llamalad7:mixinextras-fabric:0.5.5"))
}

loom {
	accessWidenerPath = file("src/main/resources/wurstpenguin.accesswidener")
}

sourceSets {
		main {
			java {
				exclude "net/wurstclient/clickgui2/component/*.java"
				exclude "net/wurstclient/clickgui2/component.disabled/*.java"
				exclude "net/wurstclient/clickgui2/animation.disabled/*.java"
				exclude "net/wurstclient/clickgui2/components.disabled/*.java"
				exclude "net/wurstclient/clickgui2/screens.disabled/*.java"
				exclude "net/wurstclient/clickgui2/theme.disabled/*.java"
				exclude "net/wurstclient/clickgui2/window.disabled/*.java"
			}
		}
	}


processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

if(project.hasProperty("spWorld")) {
	tasks.matching { it.name == "runClient" }.configureEach {
		args "--quickPlaySingleplayer", project.property("spWorld")
		args "--quickPlayPath", project.property("spLog")
	}
}

processResources {
    from({ configurations.hudNatives.collect { zipTree(it) } }) {
        include "windows/**", "linux/**", "macos/**"
        into "assets/wurstpenguin/nanovg/natives"
        exclude "META-INF/**", "module-info.class", "**/*.signature"
    }
}

// v1.5.2 music and seed backend for the 1.20.2-1.20.4 protocol family.
dependencies {
    include implementation("com.googlecode.soundlibs:jlayer:1.0.1.4") { transitive = false }
    include implementation("com.google.zxing:core:3.5.3")
    compileOnly "net.java.dev.jna:jna:5.13.0"
    modImplementation "local.seedfinding:seedcrackerX:2.15.5"
    include "local.seedfinding:seedcrackerX:2.15.5"
    modImplementation fileTree(dir: "libs/seedcrackerx-deps", include: ["cloth-config*.jar"])
}
tasks.withType(Test).configureEach { useJUnitPlatform() }

dependencies { runtimeOnly fileTree(dir: "libs/seedcrackerx-deps", include: ["mc_*.jar", "latticg-*.jar"]) }
