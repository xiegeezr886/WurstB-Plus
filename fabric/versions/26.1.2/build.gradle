plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	mavenCentral()
	flatDir {
		dirs "libs"
	}
}

dependencies {
	// Minecraft (non-obfuscated, no mappings needed for 26.x)
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// JSR305 (needed for BlockPos @Immutable)
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"

	// Discord support
	include implementation("org.java-websocket:Java-WebSocket:1.5.3")

	// Proxy support
	include implementation("io.netty:netty-codec-socks:4.1.118.Final")
	include implementation("io.netty:netty-handler-proxy:4.1.118.Final")

	// Baritone
	include implementation("baritone:baritone-api-fabric:1.15.0")

	// MixinExtras
	compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"
	annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.4"
}

loom {
	accessWidenerPath = file("src/main/resources/wurstpenguin.accesswidener")
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
	it.options.compilerArgs += "--enable-preview"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Test).configureEach {
	jvmArgs += "--enable-preview"
}

tasks.withType(JavaExec).configureEach {
	jvmArgs += "--enable-preview"
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
}
