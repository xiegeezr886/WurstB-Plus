buildscript {
    repositories {
        maven {
            name = "Sponge"
            url = "https://repo.spongepowered.org/repository/maven-public/"
        }
    }
    dependencies {
        classpath "org.spongepowered:mixingradle:0.7-SNAPSHOT"
    }
}

plugins {
    id "eclipse"
    id "idea"
    id "maven-publish"
    id "net.minecraftforge.gradle" version "[6.0,6.2)"
}

apply plugin: "org.spongepowered.mixin"

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "WurstB+ Plus"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: "official", version: project.minecraft_version
    accessTransformer = file(
        "src/main/resources/META-INF/accesstransformer.cfg")
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
            property "forge.logging.console.level", "info"

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}
    }
}

repositories {
    maven {
        name = "Sponge"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
    mavenCentral()
    flatDir {
        dirs projectDir
    }
}

jarJar.enable()

configurations {
	hudNatives
}

apply from: 'gradle/seedcracker-native1201.gradle'

dependencies {
    minecraftLibrary("org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}") { transitive = false }
    runtimeOnly "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-windows-arm64"
    runtimeOnly "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-linux-arm64"
    runtimeOnly "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-macos-arm64"
    hudNatives "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}"
    hudNatives "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-windows"
    hudNatives "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-windows-arm64"
    hudNatives "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-linux"
    hudNatives "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-linux-arm64"
    hudNatives "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-macos"
    hudNatives "org.lwjgl:lwjgl-nanovg:${lwjgl_nanovg_version}:natives-macos-arm64"

    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    implementation fg.deobf(
        "io.github.llamalad7:mixinextras-forge:0.5.4")
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.4"
    jarJar(group: "io.github.llamalad7", name: "mixinextras-forge",
        version: "[0.5.4,)")
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
    minecraftLibrary("org.java-websocket:Java-WebSocket:1.5.3") { transitive = false }
    minecraftLibrary("io.netty:netty-codec-socks:4.1.82.Final") { transitive = false }
    minecraftLibrary("io.netty:netty-handler-proxy:4.1.82.Final") { transitive = false }
    implementation fg.deobf("baritone:baritone-api-forge:1.20.1")
    jarJar(group: "baritone", name: "baritone-api-forge",
        version: "[1.20.1,1.20.2)")
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

mixin {
	add sourceSets.main, "${project.mod_id}-refmap.json"
	config "wurst.mixins.json"
}

processResources {
    def displayVersion = project.version.toString().startsWith("v")
        ? project.version.toString().substring(1)
        : project.version.toString()
    inputs.property("version", displayVersion)

    filesMatching("META-INF/mods.toml") {
        expand(version: displayVersion)
    }
    filesMatching("wurst.mixins.json") {
        expand(version: displayVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

java {
    withSourcesJar()
}

jar {
	archiveClassifier = "dev"
	manifest {
        attributes(
            "MixinConfigs": "wurst.mixins.json",
            "Specification-Title": project.mod_id,
            "Specification-Vendor": project.mod_authors,
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": project.mod_authors)
    }

    from("LICENSE.txt") {
        rename { "LICENSE-${project.base.archivesName.get()}.txt" }
    }

    exclude "intentionally_untranslated.json"
    finalizedBy "reobfJar"
}

tasks.named("jarJar").configure {
    archiveFileName = "${project.base.archivesName.get()}-${project.version}.jar"
    finalizedBy "reobfJarJar"
}

processResources {
    inputs.property("bundledNanoVgApi", !project.hasProperty("devClient"))
    doFirst {
        if (project.hasProperty("devClient"))
            delete new File(destinationDir, "org/lwjgl/nanovg")
    }
    from({ configurations.hudNatives.collect { zipTree(it) } }) {
        if (!project.hasProperty("devClient")) include "org/lwjgl/nanovg/**"
        include "windows/**", "linux/**", "macos/**"
        exclude "META-INF/**", "module-info.class", "**/*.signature"
    }
}

// v1.5.2 music and portable tests; game supplies LWJGL core and base Netty.
dependencies {
    jarJar(group: "org.java-websocket", name: "Java-WebSocket", version: "[1.5.3,1.5.4)")
    jarJar(group: "io.netty", name: "netty-codec-socks", version: "[4.1.82.Final,4.1.83.Final)")
    jarJar(group: "io.netty", name: "netty-handler-proxy", version: "[4.1.82.Final,4.1.83.Final)")
    minecraftLibrary("com.googlecode.soundlibs:jlayer:1.0.1.4") { transitive = false }
    jarJar(group: "com.googlecode.soundlibs", name: "jlayer", version: "[1.0.1.4,1.0.1.5)")
    minecraftLibrary("com.google.zxing:core:3.5.3") { transitive = false }
    jarJar(group: "com.google.zxing", name: "core", version: "[3.5.3,3.5.4)")
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}
sourceSets.main.java {
    exclude "net/wurstclient/clickgui2/component/*.java"
    exclude "net/wurstclient/clickgui2/component.disabled/*.java"
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
