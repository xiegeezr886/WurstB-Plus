# UTF-8; dotted class/package prefixes, comma separated.
# Explicit exclude replaces the default addon prefix; built-in exclusions are always applied.
# The built-in defaults always exclude Mixin, shaded libraries and native classes.
include=net.wurstclient.
exclude=net.wurstclient.addon.
encryptStrings=true
renamePrivateMethods=true
maskNumbers=true
indirectPrivateCalls=true
stripDebug=true
# Additional method names used through dynamic reflection (never renamed).
keepMethods=
