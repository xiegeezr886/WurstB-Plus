plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.output.resourcesDir =
    sourceSets.main.java.destinationDirectory.get().asFile

configurations {
    allJarEmbed
}

minecraft {
    // ForgeGradle 7 only applies access transformers to the dev classpath when
    // this is enabled; true = src/main/resources/META-INF/accesstransformer.cfg.
    accessTransformer = true


    mappings channel: "official", version: project.minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        register('client') {
            args '--mixin.config', 'wurst.mixins.json'
        }

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', project.mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    maven {
        name = "BundledBaritone"
        url = uri("../../baritone-maven")
    }
    maven {
        name = "Sponge"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    flatDir {
        dirs ".", "libs"
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")

    implementation "io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}"
    compileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
    implementation "org.java-websocket:Java-WebSocket:1.5.3"
    implementation "io.netty:netty-codec-socks:4.1.118.Final"
    implementation "io.netty:netty-handler-proxy:4.1.118.Final"
    implementation "baritone:baritone-forge:1.13.1-1.21.4"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    // NOTE: eventbus-validator:7.0.5 needs the EventBus 7 API, which does not
    // exist on the Forge 54.x (MC 1.21.4) line. It aborts the build with
    // "unable to get the compiler type elements required for validating
    // EventBus API usages". Do not re-add it for 1.21.4.
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
    testRuntimeOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
}

processResources {
    def displayVersion = project.version.toString().startsWith("v")
        ? project.version.toString().substring(1)
        : project.version.toString()
    inputs.property("version", displayVersion)

    filesMatching("META-INF/mods.toml") {
        expand(version: displayVersion)
    }

    exclude "META-INF/jarjar/metadata.json"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    options.compilerArgs += ["-Xmaxerrs", "1000"]
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
}

jar {
    archiveClassifier = "dev"
    manifest {
        attributes(
            "MixinConfigs": "wurst.mixins.json",
            "Specification-Title": project.mod_id,
            "Specification-Vendor": project.mod_authors,
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": project.mod_authors)
    }

    from("LICENSE.txt") {
        rename { "LICENSE-${project.base.archivesName.get()}.txt" }
    }

    exclude "intentionally_untranslated.json"
}

tasks.register('allJar', Jar) {
    group = 'build'
    description = 'Assembles a fat jar including runtime dependencies.'
    dependsOn tasks.classes
    archiveFileName = "${project.base.archivesName.get()}-${project.version}.jar"
    zip64 = true
    manifest.from(tasks.jar.manifest)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from("src/main/resources/META-INF/jarjar/metadata.json") {
        into "META-INF/jarjar"
    }
    from {
        (configurations.runtimeClasspath.files + configurations.allJarEmbed.files).findAll { dependency ->
            def fileName = dependency.name
            fileName.startsWith('Java-WebSocket')
                || fileName.startsWith('netty-codec-socks')
                || fileName.startsWith('netty-handler-proxy')
        }.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
    from("../../baritone-maven/baritone/baritone-forge/1.13.1-1.21.4/baritone-forge-1.13.1-1.21.4.jar") {
        into "META-INF/jarjar"
    }
    exclude 'net/minecraft/**', 'net/minecraftforge/**'
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA', 'module-info.class'
}
