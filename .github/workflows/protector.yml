name: Protector regression tests

on:
  push:
    paths:
      - 'tools/protector/**'
      - 'scripts/protect-jar.ps1'
      - '.github/workflows/protector.yml'
  pull_request:
    paths:
      - 'tools/protector/**'
      - 'scripts/protect-jar.ps1'
      - '.github/workflows/protector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Protect and execute fixtures with JVM verification
        run: gradle -p tools/protector test installDist --no-daemon --console=plain
