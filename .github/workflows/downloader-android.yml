name: WDownloader Android
on:
  workflow_dispatch:
  push:
    paths: ['downloader/Android/**', 'downloader/Frontend/**', 'downloader/Core/MirrorHosts.txt', 'downloader/ReleaseSnapshot.json', '.github/workflows/downloader-android.yml']
  pull_request:
    paths: ['downloader/Android/**', 'downloader/Frontend/**', 'downloader/Core/MirrorHosts.txt', 'downloader/ReleaseSnapshot.json', '.github/workflows/downloader-android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build shared UI
        run: |
          pnpm --dir downloader/Frontend install --frozen-lockfile
          pnpm --dir downloader/Frontend build
      - name: HTTP transport tests
        working-directory: downloader/Android
        run: |
          mkdir -p build/engine-tests
          javac --add-modules jdk.httpserver -encoding UTF-8 -d build/engine-tests app/src/main/java/org/wurstb/downloader/TransferEngine.java tests/TransferEngineTest.java
          java --add-modules jdk.httpserver -cp build/engine-tests org.wurstb.downloader.TransferEngineTest
      - name: Build and lint APK
        working-directory: downloader/Android
        run: bash gradlew assembleDebug lintDebug --no-daemon
      - name: Name APK
        run: cp downloader/Android/app/build/outputs/apk/debug/app-debug.apk WDownloader-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WDownloader-Android-debug
          path: WDownloader-Android-debug.apk
