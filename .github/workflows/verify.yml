name: Verify

# 目标（AUDIT-ROUND2 §六 第 2 项）：把两个已经写好但没有触发者的闸门接进 CI，
# 并加一个最小的编译 job。
#
# 为什么需要它：仓库此前只有一个 workflow（重建版本快照分支），**没有任何 job 会
# 编译代码或跑测试**。于是「依赖版本漂移」和「状态文档与现实脱节」这两类问题只能
# 靠人记得去跑脚本才会被发现 —— 现实中它们已经各自漂移过一次：
#   * 依赖登记表与 67 个构建文件的版本号会悄悄分叉；
#   * docs/STATUS.md 在本次接 CI 时就是**红的**（过期，已一并重新生成）。
#
# 两个闸门都是纯文本比对，各自约几十秒；compileJava 只编根工程（Forge 1.20.1），
# 是全仓最便宜、且依赖最少的一个真实编译信号 —— 不做全量 67 工程构建，
# 那需要反编译 Minecraft，单工程以十分钟计。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: 依赖登记表 / 状态文档 闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu runner 自带 pwsh。仓库脚本在 Windows PowerShell 5.1 下写的，
      # 但只用核心 cmdlet，pwsh 7 可直接跑。
      - name: 依赖版本闸门
        shell: pwsh
        run: ./scripts/dependency-versions.ps1 -Check

      - name: 状态文档闸门
        shell: pwsh
        run: ./scripts/generate-status.ps1 -Check

  compile:
    name: 根工程 compileJava
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-root-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'gradle.properties') }}
          restore-keys: gradle-root-${{ runner.os }}-

      - name: compileJava
        run: ./gradlew compileJava --console=plain --no-daemon
